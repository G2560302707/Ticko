<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>和 Ticko 聊聊</title><style>
:root{--ink:#172335;--muted:#718098;--line:#d9e3ed;--card:#fff;--soft:#eef4f8;--green:#168266;--mine:#e6f3f0}*{box-sizing:border-box}body{margin:0;background:#f4f7f9;color:var(--ink);font-family:"Microsoft YaHei UI","Microsoft YaHei",sans-serif;overflow:hidden}.shell{height:100vh;display:grid;grid-template-rows:auto 1fr auto;padding:14px;gap:10px}.head{display:flex;justify-content:space-between;align-items:center;padding:1px 2px}.head h1{font-size:17px;margin:0}.status{font-size:12px;color:var(--muted)}.controls{display:flex;gap:6px}.control{border:1px solid var(--line);background:#fff;color:#43536a;border-radius:8px;padding:5px 8px;font:12px inherit;cursor:pointer}.control.primary{background:var(--green);border-color:var(--green);color:white}.control[disabled]{opacity:.48;cursor:default}.messages{overflow:auto;display:flex;flex-direction:column;gap:8px;padding:2px 3px}.bubble{max-width:88%;padding:9px 11px;border:1px solid var(--line);border-radius:12px 12px 12px 4px;background:var(--card);font-size:14px;line-height:1.55;white-space:pre-wrap;box-shadow:0 2px 8px rgba(23,35,53,.03)}.bubble.me{align-self:flex-end;border-radius:12px 12px 4px 12px;background:var(--mine);border-color:#acd4c9}.who{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}.streaming::after{content:'▋';color:var(--green);margin-left:2px;animation:blink .7s steps(1) infinite}@keyframes blink{50%{opacity:0}}.compose{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:9px 11px}.compose input{border:0;outline:0;width:100%;font:14px inherit;color:var(--ink);background:transparent}.compose input::placeholder{color:#97a5b4}.hint{margin-top:5px;color:var(--muted);font-size:11px}
</style></head><body><main class="shell"><header class="head"><div><h1>和 Ticko 聊聊</h1><span class="status" id="status">点击开始对话后再说话</span></div><div class="controls"><button id="start" class="control primary">开始对话</button><button id="stop" class="control" disabled>结束对话</button></div></header><section id="messages" class="messages" aria-live="polite"></section><div class="compose"><input id="input" maxlength="480" autocomplete="off" placeholder="也可以直接输入，按 Enter 发送"><div class="hint">开始后自动聆听；结束后不会再使用麦克风</div></div></main><script>
const $=id=>document.getElementById(id),messages=$('messages'),input=$('input'),status=$('status'),start=$('start'),stop=$('stop');let sending=false,listenTimer=0,conversationActive=false,recoveries=0,recoverTimer=0;
function scroll(){messages.scrollTop=messages.scrollHeight}function bubble(role,text,stream){const el=document.createElement('div');el.className='bubble'+(role==='user'?' me':'')+(stream?' streaming':'');if(role!=='user'){const n=document.createElement('span');n.className='who';n.textContent='Ticko';el.append(n)}const t=document.createTextNode(stream?'':text||'');el.append(t);messages.append(el);scroll();return{el,t,text:text||''}}
function show(items){messages.innerHTML='';(items&&items.length?items:[{role:'assistant',content:'我在。请对我说话。'}]).forEach(i=>bubble(i.role,i.content));scroll()}
function waitForSpeech(){if(!conversationActive)return;fetch('/api/companion/speaking').then(r=>r.json()).then(j=>{if(j.speaking){status.textContent='Ticko 正在说话…';setTimeout(waitForSpeech,220)}else setTimeout(startListening,180)}).catch(()=>setTimeout(startListening,500))}
function reveal(node){let i=0,step=Math.max(1,Math.ceil(node.text.length/90));(function next(){i=Math.min(node.text.length,i+step);node.t.textContent=node.text.slice(0,i);scroll();if(i<node.text.length)setTimeout(next,18);else{node.el.classList.remove('streaming');waitForSpeech()}})()}
async function send(text){text=(text||'').trim();if(!text||sending)return;sending=true;input.value='';bubble('user',text);status.textContent='Ticko 正在思考…';try{const r=await fetch('/api/companion/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text})});const j=await r.json();if(!r.ok||!j.ok)throw Error(j.error||'暂时无法回应');const last=bubble('assistant',j.reply||'',true);status.textContent=j.source==='model'?'正在回复':'本地陪伴';reveal(last)}catch(e){status.textContent='没有听清，请再说一次';bubble('assistant','刚才没有听清，请再说一次。');setTimeout(startListening,700)}finally{sending=false}}
function clearListenTimer(){clearInterval(listenTimer);listenTimer=0;clearTimeout(recoverTimer);recoverTimer=0}
async function recoverListening(reason){clearListenTimer();if(!conversationActive)return;if(recoveries>=3){status.textContent='麦克风暂时不可用，请结束后重新开始对话';return}recoveries++;status.textContent=(reason||'识别服务正在恢复')+'…';try{await fetch('/api/companion/listen/stop',{method:'POST'})}catch(e){}recoverTimer=setTimeout(()=>{recoverTimer=0;startListening()},420)}
async function startListening(){if(!conversationActive||sending||listenTimer||recoverTimer)return;try{const r=await fetch('/api/companion/listen',{method:'POST'}),j=await r.json();if(!r.ok||!j.ok||!j.started)throw Error(j.error||'识别服务忙');status.textContent='正在聆听…说完会自动发送';listenTimer=setInterval(pollListening,220)}catch(e){recoverListening('识别服务正在恢复')}}
async function pollListening(){try{const r=await fetch('/api/companion/listen'),j=await r.json(),s=j.listen||{};if(s.state==='listening'||s.state==='starting')return;clearInterval(listenTimer);listenTimer=0;if(!conversationActive)return;if(s.state==='ready'&&s.text){recoveries=0;status.textContent='正在理解…';send(s.text);return}recoverListening(s.error||'没有听清，正在重新聆听')}catch(e){recoverListening('语音服务连接中断，正在恢复')}}
async function endConversation(){conversationActive=false;clearListenTimer();recoveries=0;start.disabled=false;stop.disabled=true;try{await fetch('/api/companion/listen/stop',{method:'POST'})}catch(e){}status.textContent='对话已结束，麦克风已关闭';}
start.addEventListener('click',()=>{conversationActive=true;recoveries=0;start.disabled=true;stop.disabled=false;startListening()});stop.addEventListener('click',endConversation);input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();send(input.value)}});fetch('/api/companion/history').then(r=>r.json()).then(d=>show(d.items)).catch(()=>show([])).finally(()=>input.focus());
</script></body></html>
